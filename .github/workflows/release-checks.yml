name: Release checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install the pinned offline Lua test host
        run: python -m pip install -r requirements-test.txt
      - name: Run the current release contract
        run: python docs/NeverLockSavesReborn/validation/run_release_checks.py --release . --output ../release-checks --lupa
